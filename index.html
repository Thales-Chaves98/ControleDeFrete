<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Fretes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body>
    
    <header>
        <section class="config">
            <span class="material-symbols-outlined logo">delivery_truck_speed</span>
            <button id="theme-btn"><span class="material-symbols-outlined">brightness_5</span></button>
        </section>

        
    </header>

    <main>
        <section class="main-title">
            <h1 class="title">CONTROLE DE FRETE</h1>
        </section>
        <section class="main-input">
            <form id="input-form">
                <input type="text" placeholder="DIGITE O LOCAL DO FRETE" id="text-input">
                <button id="add-frete-btn"><span class="material-symbols-outlined">local_shipping</span></button>
            </form>
        </section>

        <!--
            TABELA DE REFERENCIA PARA JS E CSS   
        -->

        <table class="tabela-frete">
            <thead class="tabela-header">
                <th>FRETE</th>
                <th>SOLICITADO</th>
                <th>CONFIRMADO</th>
                <th>AÇÕES</th>
            </thead>
            
            <tbody>
                <tr>
                    <td>LAGUNA</td>
                    <td><input type="checkbox" name="" id=""></td>
                    <td>20/20/20</td>
                    <td><input type="checkbox" name="" id=""></td>
                    <td>21/20/20</td>
                    <td>
                        <button><span class="material-symbols-outlined">edit</span></button>
                        <button><span class="material-symbols-outlined">delete</span></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>Controle de Fretes feito por <a href="https://github.com/Thales-Chaves98" target="_blank">Thales Chaves</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
